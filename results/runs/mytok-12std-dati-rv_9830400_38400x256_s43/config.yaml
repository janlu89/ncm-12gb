base_config: artifacts/tinystories/config.yaml
tokenizer:
  livelli: 12
  schema: ufficiale
  codebook: 4096
  norma_livello0: true
  vqvae_overrides: {}
  rimedi:
    init_dati: true
    init_storie: 8192
    riavvio_fino_al_passo: 1200
    riavvio_soglia: 0.1
data:
  dir: data/raw/tinystories
  length: 128
  seed: 1234
eval:
  n_stories: 4096
  batch: 256
export:
  at_steps: []
train:
  steps: 38400
  micro_batch: 256
  accum: 1
  lr: 0.0005
  min_lr: 5.0e-05
  warmup: 1920
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  bf16: true
  seed: 43
  log_every: 50
  eval_every: 4800
  ckpt_every_steps: 0
  ckpt_every_minutes: 5
  keep_ckpts: 2
  deterministic: false
  debug_stop_at_step: null
