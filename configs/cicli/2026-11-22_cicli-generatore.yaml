# Prima prova del generatore a cicli (2026-11-22; idea da Dory 4B): un blocco centrale di strati
# applicato piu volte con gli stessi pesi. Tokenizer ufficiale, ricetta migliore, 51.200 storie, seed 42.
# Regola di lettura: docs/esperimenti/2026-11-22_cicli-generatore.md
nome: 2026-11-22_cicli-generatore
riferimento: UFF_best42
rumore: [UFF_best42, UFF_best43]
base_overrides:
  - train.steps=400
  - train.accum=8
  - train.warmup=20
  - train.eval_every=200
  - train.log_every=10
  - train.keep_ckpts=1
runs:
  - {id: UFF_best42, run: gen-tokuff_51200_400x128_c50_lr1e-3_flex_s42, descr: "12 strati normali (gia fatto)", overrides: [train.seed=42]}
  - {id: UFF_best43, run: gen-tokuff_51200_400x128_c50_lr1e-3_flex_s43, descr: "12 strati normali, seed 43 (gia fatto)", overrides: [train.seed=43]}
  - {id: C4-2x2-4, descr: "4 + 2x2 + 4: stesso calcolo, 10 strati di pesi", overrides: [train.seed=42, data.codes_file=data/processed/tinystories_codes_official_L128.u16, corruption.rate_first=0.5, corruption.rate_last=0.5, model_overrides.use_flex_attention=true, model_overrides.flex_block_size=64, train.lr=1.0e-3, train.min_lr=1.0e-4, cicli.prima=4, cicli.blocco=2, cicli.ripetizioni=2, cicli.dopo=4]}
  - {id: C4-4x2-4, descr: "4 + 4x2 + 4: stessi pesi, +33% calcolo", overrides: [train.seed=42, data.codes_file=data/processed/tinystories_codes_official_L128.u16, corruption.rate_first=0.5, corruption.rate_last=0.5, model_overrides.use_flex_attention=true, model_overrides.flex_block_size=64, train.lr=1.0e-3, train.min_lr=1.0e-4, cicli.prima=4, cicli.blocco=4, cicli.ripetizioni=2, cicli.dopo=4]}
  - {id: C4-4x3-4, descr: "4 + 4x3 + 4: stessi pesi, +67% calcolo", overrides: [train.seed=42, data.codes_file=data/processed/tinystories_codes_official_L128.u16, corruption.rate_first=0.5, corruption.rate_last=0.5, model_overrides.use_flex_attention=true, model_overrides.flex_block_size=64, train.lr=1.0e-3, train.min_lr=1.0e-4, cicli.prima=4, cicli.blocco=4, cicli.ripetizioni=3, cicli.dopo=4]}
